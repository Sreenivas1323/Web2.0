<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
  <title id="t">The flyover loop</title><desc id="d">A cycle of five steps: jam, new flyover, faster for a while, more cars, jam again.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FC466B"/><stop offset="1" stop-color="#3F5EFB"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#fff" stroke-opacity="0.035"/></pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#999"/></marker>
  </defs>
  <rect width="1200" height="520" fill="#0e0e0e"/><rect width="1200" height="520" fill="url(#grid)"/>
<text x="60" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="4" fill="#666">// THE FLYOVER LOOP</text><rect x="490.0" y="84.0" width="220" height="72" rx="12" fill="#131313" stroke="#FC466B" stroke-opacity=".8"/><text x="600.0" y="114.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" fill="#ededed" text-anchor="middle">jam</text><text x="600.0" y="138.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#FC466B" text-anchor="middle">6:30 p.m., again</text><rect x="740.6033920437729" y="201.46711095625895" width="220" height="72" rx="12" fill="#131313" stroke="#999" stroke-opacity=".8"/><text x="850.6033920437729" y="231.46711095625895" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" fill="#ededed" text-anchor="middle">new flyover</text><text x="850.6033920437729" y="255.46711095625895" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#999" text-anchor="middle">+2 yrs of digging</text><rect x="644.8814139790667" y="391.5328890437411" width="220" height="72" rx="12" fill="#131313" stroke="#4ade80" stroke-opacity=".8"/><text x="754.8814139790667" y="421.5328890437411" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" fill="#ededed" text-anchor="middle">faster!</text><text x="754.8814139790667" y="445.5328890437411" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#4ade80" text-anchor="middle">for a few months</text><rect x="335.1185860209333" y="391.5328890437411" width="220" height="72" rx="12" fill="#131313" stroke="#fbbf24" stroke-opacity=".8"/><text x="445.1185860209333" y="421.5328890437411" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" fill="#ededed" text-anchor="middle">more cars</text><text x="445.1185860209333" y="445.5328890437411" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#fbbf24" text-anchor="middle">the route is good now</text><rect x="239.396607956227" y="201.46711095625898" width="220" height="72" rx="12" fill="#131313" stroke="#FC466B" stroke-opacity=".8"/><text x="349.396607956227" y="231.46711095625898" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" fill="#ededed" text-anchor="middle">jam moves</text><text x="349.396607956227" y="255.46711095625898" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#FC466B" text-anchor="middle">to the end of the flyover</text><ellipse cx="600" cy="290" rx="263.5" ry="170" fill="none" stroke="#999" stroke-opacity=".25" stroke-width="2" stroke-dasharray="3 8"/><text x="600" y="296" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#666" text-anchor="middle">induced demand</text></svg>