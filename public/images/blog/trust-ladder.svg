<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
  <title id="t">The trust ladder</title><desc id="d">Five rungs from autocomplete to intern, junior, colleague and an unknown top rung; each rung reduces what you need to check.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FC466B"/><stop offset="1" stop-color="#3F5EFB"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#fff" stroke-opacity="0.035"/></pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#999"/></marker>
  </defs>
  <rect width="1200" height="560" fill="#0e0e0e"/><rect width="1200" height="560" fill="url(#grid)"/>
<text x="60" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="4" fill="#666">// THE TRUST LADDER</text><text x="60" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="34" font-weight="700" fill="#ededed">What you stop checking.</text><text x="60" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#999">Each rung up, you review less of the work and more of the result.</text><rect x="60" y="440" width="214" height="96" rx="12" fill="#131313" stroke="#fff" stroke-opacity=".12"/><text x="76" y="470" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" fill="#ededed">autocomplete</text><text x="76" y="496" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#999">finishes your line</text><text x="76" y="518" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#666">you check: every word</text><rect x="282" y="360" width="214" height="96" rx="12" fill="#131313" stroke="#fff" stroke-opacity=".12"/><text x="298" y="390" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" fill="#ededed">intern</text><text x="298" y="416" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#999">does the step you spell out</text><text x="298" y="438" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#666">you check: every line</text><rect x="504" y="280" width="214" height="96" rx="12" fill="#131313" stroke="#fff" stroke-opacity=".12"/><text x="520" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" fill="#ededed">junior</text><text x="520" y="336" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#999">does a task with a spec</text><text x="520" y="358" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#666">you check: every function</text><rect x="726" y="200" width="214" height="96" rx="12" fill="#141418" stroke="#3F5EFB" stroke-opacity=".9"/><text x="742" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" fill="#ededed">colleague</text><text x="742" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#999">owns a ticket, pushes back</text><text x="742" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#3F5EFB">you check: the PR</text><text x="742" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#3F5EFB">← 2026, roughly here</text><rect x="948" y="120" width="214" height="96" rx="12" fill="#131313" stroke="#fff" stroke-opacity=".12" stroke-dasharray="5 6"/><text x="964" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" fill="#666">?</text><text x="964" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#999">owns an outcome</text><text x="964" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#666">you check: the result</text><path d="M80 540 L1140 120" stroke="url(#brand)" stroke-width="2" stroke-dasharray="2 8" opacity=".6"/></svg>