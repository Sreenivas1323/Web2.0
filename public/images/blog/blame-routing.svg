<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
  <title id="t">Blame routing</title><desc id="d">Flow: something breaks, the AI did the work, the question who signed off, routed to a human whose name is on it.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FC466B"/><stop offset="1" stop-color="#3F5EFB"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#fff" stroke-opacity="0.035"/></pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#999"/></marker>
  </defs>
  <rect width="1200" height="520" fill="#0e0e0e"/><rect width="1200" height="520" fill="url(#grid)"/>
<text x="60" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="4" fill="#666">// BLAME ROUTING</text><rect x="60" y="200" width="240" height="120" rx="14" fill="#131313" stroke="#fbbf24" stroke-opacity=".8"/><text x="80" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="700" fill="#ededed">something breaks</text><text x="80" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#fbbf24">refund paid 100×</text><rect x="340" y="200" width="240" height="120" rx="14" fill="#131313" stroke="#3F5EFB" stroke-opacity=".8"/><text x="360" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="700" fill="#ededed">AI did the work</text><text x="360" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#3F5EFB">fast · tireless · nameless</text><rect x="620" y="200" width="240" height="120" rx="14" fill="#131313" stroke="#999" stroke-opacity=".8"/><text x="640" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="700" fill="#ededed">post-mortem asks</text><text x="640" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#999">“who signed off?”</text><rect x="900" y="200" width="240" height="120" rx="14" fill="#131313" stroke="#FC466B" stroke-opacity=".8"/><text x="920" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="700" fill="#ededed">a human</text><text x="920" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#FC466B">their name is on it</text><path d="M304 260 H334" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><path d="M584 260 H614" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><path d="M864 260 H894" stroke="#999" stroke-width="2" marker-end="url(#arr)"/><path d="M460 330 C460 430 1020 430 1020 330" fill="none" stroke="#FC466B" stroke-width="2" stroke-dasharray="4 6" marker-end="url(#arr)"/><text x="740" y="450" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#FC466B" text-anchor="middle">the model can’t be fired, sued, or say sorry, so the arrow skips it</text></svg>