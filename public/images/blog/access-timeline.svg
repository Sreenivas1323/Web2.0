<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
  <title id="t">Two tracks toward access</title><desc id="d">Top track: pirated CDs and file sharing, then online music stores, then streaming. Bottom track: Linux, VLC, Blender, Git, then open-source everything.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FC466B"/><stop offset="1" stop-color="#3F5EFB"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#fff" stroke-opacity="0.035"/></pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#999"/></marker>
  </defs>
  <rect width="1200" height="560" fill="#0e0e0e"/><rect width="1200" height="560" fill="url(#grid)"/>
<text x="60" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="4" fill="#666">// TWO TRACKS, SAME DIRECTION</text><text x="60" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" fill="#FC466B">PIRATES → THE INDUSTRY CATCHES UP</text><path d="M80 200 H1130" stroke="#FC466B" stroke-opacity=".5" stroke-width="3" marker-end="url(#arr)"/><circle cx="120" cy="200" r="9" fill="#FC466B"/><text x="120" y="234" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#666" text-anchor="middle">late 90s</text><text x="120" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#ededed" text-anchor="middle">CDs from the local shop</text><circle cx="360" cy="200" r="9" fill="#FC466B"/><text x="360" y="234" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#666" text-anchor="middle">~2000</text><text x="360" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#ededed" text-anchor="middle">file sharing</text><circle cx="600" cy="200" r="9" fill="#FC466B"/><text x="600" y="234" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#666" text-anchor="middle">2000s</text><text x="600" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#ededed" text-anchor="middle">buy one song online</text><circle cx="840" cy="200" r="9" fill="#FC466B"/><text x="840" y="234" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#666" text-anchor="middle">2010s</text><text x="840" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#ededed" text-anchor="middle">stream everything</text><circle cx="1080" cy="200" r="9" fill="#FC466B"/><text x="1080" y="234" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#666" text-anchor="middle">now</text><text x="1080" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#ededed" text-anchor="middle">free tiers, student plans</text><text x="60" y="380" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" fill="#3F5EFB">OPEN SOURCE → THE COMMONS</text><path d="M80 420 H1130" stroke="#3F5EFB" stroke-opacity=".5" stroke-width="3" marker-end="url(#arr)"/><circle cx="120" cy="420" r="9" fill="#3F5EFB"/><text x="120" y="454" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#666" text-anchor="middle">1991</text><text x="120" y="476" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#ededed" text-anchor="middle">Linux</text><circle cx="360" cy="420" r="9" fill="#3F5EFB"/><text x="360" y="454" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#666" text-anchor="middle">2000s</text><text x="360" y="476" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#ededed" text-anchor="middle">VLC</text><circle cx="600" cy="420" r="9" fill="#3F5EFB"/><text x="600" y="454" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#666" text-anchor="middle">2002</text><text x="600" y="476" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#ededed" text-anchor="middle">Blender goes open</text><circle cx="840" cy="420" r="9" fill="#3F5EFB"/><text x="840" y="454" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#666" text-anchor="middle">2005</text><text x="840" y="476" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#ededed" text-anchor="middle">Git</text><circle cx="1080" cy="420" r="9" fill="#3F5EFB"/><text x="1080" y="454" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#666" text-anchor="middle">now</text><text x="1080" y="476" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#ededed" text-anchor="middle">open tools everywhere</text></svg>