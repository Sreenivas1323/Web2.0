  <title id="t">99% automated, 1% to blame</title>
  <desc id="d">A ten by ten grid: ninety-nine blue squares for automated work and one pink square for the human who gets blamed.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FC466B"/><stop offset="1" stop-color="#3F5EFB"/></linearGradient>
