<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
  <title id="t">The two best things in this world</title>
  <desc id="d">A pirate flag and an open-source branching icon side by side, joined by a plus sign.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FC466B"/><stop offset="1" stop-color="#3F5EFB"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#fff" stroke-opacity="0.035"/></pattern>
    <radialGradient id="glowP" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FC466B" stop-opacity=".35"/><stop offset="1" stop-color="#FC466B" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#3F5EFB" stop-opacity=".35"/><stop offset="1" stop-color="#3F5EFB" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#0b0b0b"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="60" y="70" font-size="13" letter-spacing="4" fill="#666">// WRITING · 05</text>
    <text x="1140" y="70" font-size="13" letter-spacing="2" fill="#666" text-anchor="end">SSAISREENIVAS.IN</text>
  </g>

  <circle cx="330" cy="400" r="230" fill="url(#glowP)"/>
  <circle cx="880" cy="400" r="230" fill="url(#glowB)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="60" y="150" font-size="46" font-weight="700" fill="#ededed">The two best things</text>
    <text x="60" y="210" font-size="46" font-weight="700" fill="url(#brand)">in this world.</text>
  </g>
  <!-- flag -->
  <g transform="translate(220 270)">
    <path d="M0 0 V260" stroke="#999" stroke-width="5" stroke-linecap="round"/>
    <path d="M4 6 C70 -10 130 26 230 4 V150 C130 172 70 136 4 152 Z" fill="#141414" stroke="#FC466B" stroke-width="2"/>
    <circle cx="117" cy="62" r="30" fill="#ededed"/>
    <rect x="98" y="80" width="38" height="20" rx="4" fill="#ededed"/>
    <circle cx="105" cy="60" r="8" fill="#141414"/><circle cx="129" cy="60" r="8" fill="#141414"/>
    <path d="M78 112 L156 136 M156 112 L78 136" stroke="#ededed" stroke-width="9" stroke-linecap="round"/>
    <text x="117" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#FC466B" text-anchor="middle">01 · DIGITAL PIRATES</text>
  </g>
  <text x="600" y="430" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="54" fill="#666" text-anchor="middle">+</text>
  <!-- branch -->
  <g transform="translate(770 290)" stroke="#3F5EFB" stroke-width="7" fill="none" stroke-linecap="round">
    <circle cx="40" cy="20" r="18"/><circle cx="40" cy="200" r="18"/><circle cx="170" cy="70" r="18"/>
    <path d="M40 38 V182"/><path d="M170 88 C170 150 40 120 40 182"/>
    <text x="105" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#3F5EFB" stroke="none" text-anchor="middle">02 · OPEN SOURCE</text>
  </g>
  <text x="600" y="590" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#999" text-anchor="middle">both answered the same question: what if everyone got access?</text>
</svg>