<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d">
  <title id="t">Thailand, March 2026</title>
  <desc id="d">Route map: Phuket, then Krabi, then Bangkok, then Pattaya. Twelve days.</desc>
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1a2b"/>
      <stop offset="1" stop-color="#0b0b0b"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FC466B"/>
      <stop offset="1" stop-color="#3F5EFB"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FC466B" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FC466B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#sea)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <circle cx="930" cy="170" r="210" fill="url(#sun)"/>

  <!-- stylised coastline: abstract, not to scale -->
  <path d="M520 40 C560 120 600 150 640 210 C680 270 700 300 690 360 C680 410 640 430 620 470 C600 520 590 560 560 610 C540 650 500 700 470 760 L0 760 L0 40 Z" fill="#141414" stroke="#ffffff" stroke-opacity="0.12"/>
  <path d="M640 210 C720 230 780 300 850 330 C900 350 940 380 960 430 C970 470 940 500 900 510 C860 520 820 500 790 470" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

  <!-- karst islands -->
  <g fill="#1c1c1c" stroke="#ffffff" stroke-opacity="0.1">
    <path d="M330 640 q10 -40 22 0 z"/>
    <path d="M360 650 q8 -30 18 0 z"/>
    <path d="M300 690 q12 -46 26 0 z"/>
    <path d="M420 600 q9 -34 20 0 z"/>
  </g>

  <!-- route -->
  <path id="r" d="M300 660 C360 600 400 590 440 560 C560 460 620 300 700 250 C760 220 800 300 840 360" fill="none" stroke="url(#route)" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 14"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#ededed">
    <!-- Phuket -->
    <circle cx="300" cy="660" r="9" fill="#FC466B"/>
    <circle cx="300" cy="660" r="20" fill="none" stroke="#FC466B" stroke-opacity="0.4"/>
    <text x="150" y="626" font-size="22" font-weight="700">01 PHUKET</text>
    <text x="150" y="652" font-size="14" fill="#999">MAR 07–09</text>

    <!-- Krabi -->
    <circle cx="440" cy="560" r="9" fill="#d24d8f"/>
    <text x="466" y="566" font-size="22" font-weight="700">02 KRABI</text>
    <text x="466" y="590" font-size="14" fill="#999">MAR 10–11</text>

    <!-- Bangkok -->
    <circle cx="700" cy="250" r="9" fill="#7a56c8"/>
    <text x="520" y="232" font-size="22" font-weight="700">03 BANGKOK</text>
    <text x="520" y="256" font-size="14" fill="#999">MAR 12–13</text>

    <!-- Pattaya -->
    <circle cx="840" cy="360" r="9" fill="#3F5EFB"/>
    <circle cx="840" cy="360" r="20" fill="none" stroke="#3F5EFB" stroke-opacity="0.4"/>
    <text x="870" y="366" font-size="22" font-weight="700">04 PATTAYA</text>
    <text x="870" y="390" font-size="14" fill="#999">MAR 14–16</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="60" y="90" font-size="14" letter-spacing="4" fill="#666">// EXTRAS · TRAVEL</text>
    <text x="60" y="150" font-size="56" font-weight="700" fill="#ededed">Thailand</text>
    <text x="60" y="190" font-size="18" fill="#999">12 days · 4 stops · Mar 2026</text>
    <text x="1140" y="760" font-size="13" fill="#666" text-anchor="end">not to scale · just vibes</text>
  </g>
</svg>
